<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wassers & Co. | Pure Hydration Delivery Surat</title>
  <style>
    :root { --navy: #0A192F; --card: #112240; --cyan: #00B4D8; --gold: #F59E0B; --text: #E6F1FF; --muted: #8892B0; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--navy); color: var(--text); padding: 16px; max-width: 960px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #233554; }
    .brand { font-size: 1.4rem; font-weight: 800; color: var(--cyan); letter-spacing: 1px; }
    .card { background: var(--card); padding: 18px; border-radius: 14px; border: 1px solid #233554; margin-top: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 16px; }
    .prod-img { width: 100%; height: 150px; object-fit: contain; background: #0A192F; border-radius: 10px; padding: 8px; }
    .specs { font-size: 0.78rem; color: var(--cyan); background: rgba(0,180,216,0.12); padding: 4px 8px; border-radius: 6px; display: inline-block; margin: 6px 0; }
    .btn { background: var(--cyan); color: #0A192F; border: none; padding: 10px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
    .btn-outline { background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; display: inline-block; }
    .btn-gold { background: var(--gold); color: #0A192F; padding: 8px 12px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 0.85rem; display: inline-block; }
    input, select { width: 100%; padding: 10px; margin: 6px 0 12px; border-radius: 8px; border: 1px solid #233554; background: #0A192F; color: white; }
    .hub { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <header>
    <div class="brand">WASSERS & CO.</div>
    <div id="authHeader">
      <button class="btn-outline" onclick="document.getElementById('loginModal').style.display='block'">Staff / Client Login</button>
    </div>
  </header>

  <!-- LOGIN BOX (Routes Owner -> admin.html, Rider -> rider.html, Client -> stays here) -->
  <div id="loginModal" class="card" style="display:none;">
    <h3 style="margin-top:0; color:var(--cyan);">Account Sign In</h3>
    <input type="email" id="loginEmail" placeholder="Email (Owner, Rider, or Client)" />
    <input type="password" id="loginPass" placeholder="Password" />
    <button class="btn" id="loginBtn">Sign In</button>
    <p id="loginMsg" style="color:#ef4444; font-size:0.85rem;"></p>
  </div>

  <!-- LIVE PRODUCT CATALOG -->
  <h2 style="margin-top:20px;">Premium Drinking Water Range</h2>
  <div id="catalogGrid" class="grid">Loading Wassers & Co. catalog...</div>

  <!-- INSTANT ORDER & SURAT DELIVERY FORM -->
  <div class="card" id="checkoutSection" style="display:none;">
    <h3 style="margin-top:0; color:var(--cyan);">Complete Your Order: <span id="selectedProdName"></span></h3>
    <input type="text" id="custName" placeholder="Your Full Name / Business Name" />
    <input type="tel" id="custPhone" placeholder="Mobile Number (WhatsApp)" />
    <select id="custZone">
      <option value="Begampura">Begampura, Surat</option>
      <option value="Vesu">Vesu, Surat</option>
      <option value="Adajan">Adajan, Surat</option>
      <option value="Piplod">Piplod, Surat</option>
      <option value="Ring Road">Ring Road / Textile Market, Surat</option>
    </select>
    <input type="text" id="custAddress" placeholder="Full Street / Shop / Apartment Address" />
    <button class="btn" id="placeOrderBtn">Confirm Order & Pay via UPI / Cash</button>
  </div>

  <!-- GOOGLE REVIEWS, WEBSITE & CONCIERGE HUB -->
  <div class="card hub">
    <div>
      <strong>Wassers & Co. Surat</strong><br>
      <small style="color:var(--muted);">24/7 Bulk & Commercial Hydration Supply</small>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a id="googleReviewBtn" href="https://g.page/r/" target="_blank" class="btn-gold">★ Rate Us on Google</a>
      <a id="websiteBtn" href="https://wassersand.co" target="_blank" class="btn-outline">Visit wassersand.co</a>
      <a href="https://wa.me/918469277377?text=Hello%20Wassers%20%26%20Co.%2C%20I%20need%20water%20delivery%20in%20Surat." target="_blank" class="btn-outline">WhatsApp 846-WASSERS</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      const firebaseConfig = {
    apiKey: "AIzaSyBDFqeVALHqS7HgkyQLHf0OrmgEEuQXttE",
    authDomain: "wassers-app.firebaseapp.com",
    projectId: "wassers-app",
    storageBucket: "wassers-app.firebasestorage.app",
    messagingSenderId: "75361094126",
    appId: "1:75361094126:web:f151de8abb748e07aba6ff",
    measurementId: "G-2TV4EGYW19"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let selectedProduct = null;

    // 1. SMART ROLE ROUTING ON LOGIN
    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const snap = await getDoc(doc(db, "users", user.uid));
      const role = snap.exists() ? snap.data().role : "customer";
      if (role === "owner" || role === "admin") {
        window.location.href = "/admin.html";
      } else if (role === "rider") {
        window.location.href = "/rider.html";
      } else {
        document.getElementById("loginModal").style.display = "none";
        document.getElementById("authHeader").innerHTML = `<button class="btn-outline" id="signOutBtn">Sign Out</button>`;
        document.getElementById("signOutBtn").onclick = () => signOut(auth);
      }
    });

    document.getElementById("loginBtn").onclick = async () => {
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPass").value);
      } catch (e) {
        document.getElementById("loginMsg").innerText = "Invalid credentials: " + e.message;
      }
    };

    // 2. LOAD LIVE PRODUCTS FROM ADMIN PANEL
    onSnapshot(collection(db, "products"), (snap) => {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = snap.empty ? "<p>Catalog updating soon...</p>" : "";
      snap.forEach((d) => {
        const p = d.data();
        grid.innerHTML += `
          <div class="card" style="margin-top:0;">
            <img src="${p.mediaUrl || './logo.png'}" class="prod-img" alt="${p.name}" />
            <h3 style="margin:10px 0 4px;">${p.name}</h3>
            <div class="specs">TDS: ${p.tds || '65 PPM'} • pH: ${p.ph || '7.4'}</div>
            <div style="font-size:1.2rem; font-weight:bold; color:var(--cyan);">₹${p.price} <small style="font-size:0.8rem; color:var(--muted);">/ ${p.volume || 'unit'}</small></div>
            <button class="btn" onclick='window.selectItem(${JSON.stringify({id: d.id, name: p.name, price: p.price})})'>Order Now</button>
          </div>`;
      });
    });

    window.selectItem = (prod) => {
      selectedProduct = prod;
      document.getElementById("selectedProdName").innerText = `${prod.name} (₹${prod.price})`;
      document.getElementById("checkoutSection").style.display = "block";
      document.getElementById("checkoutSection").scrollIntoView({ behavior: "smooth" });
    };

    // 3. SAVE ORDER TO FIRESTORE & OPEN WHATSAPP CONFIRMATION
    document.getElementById("placeOrderBtn").onclick = async () => {
      if (!selectedProduct) return;
      const orderData = {
        customerName: document.getElementById("custName").value,
        customerPhone: document.getElementById("custPhone").value,
        zone: document.getElementById("custZone").value,
        address: document.getElementById("custAddress").value,
        items: [selectedProduct],
        totalAmount: selectedProduct.price,
        paymentStatus: "Pending UPI/COD",
        deliveryStatus: "Pending",
        createdAt: serverTimestamp()
      };
      await addDoc(collection(db, "orders"), orderData);
      alert("Order placed! Our Surat dispatch team has received it.");
      document.getElementById("checkoutSection").style.display = "none";
    };

    // 4. SYNC GOOGLE REVIEW & WEBSITE LINKS
    onSnapshot(doc(db, "settings", "company_info"), (snap) => {
      if (snap.exists()) {
        if (snap.data().googleReviewUrl) document.getElementById("googleReviewBtn").href = snap.data().googleReviewUrl;
        if (snap.data().websiteUrl) document.getElementById("websiteBtn").href = snap.data().websiteUrl;
      }
    });
  </script>
</body>
</html>
