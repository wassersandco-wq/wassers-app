<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wassers & Co. | Premium Hydration</title>
  <link rel="manifest" href="manifest.json">
  <!-- Tailwind CSS for Luxury Styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Thin Line Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Maps API Key -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCdaFfg4SsMOWuK4mU5d_2oNX-FwQT5rgU"></script>
  
  <!-- Razorpay SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: { colors: { wassersGold: '#D4AF37', luxuryDark: '#111827' } }
      }
    }
  </script>
  <style>
    body::-webkit-scrollbar { display: none; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body class="bg-luxuryDark text-white font-sans pb-20 selection:bg-wassersGold">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-gray-800 p-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold text-wassersGold tracking-widest">WASSERS & CO.</h1>
      <p class="text-xs text-gray-400">Clean Water, Clear Promise</p>
    </div>
    <div class="relative">
      <i class="fas fa-bell text-gray-300 text-xl"></i>
      <span class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] px-1 rounded-full">1</span>
    </div>
  </header>

  <!-- APP CONTENT AREA -->
  <main id="app-container" class="p-4">
    
    <!-- 1. HOME TAB -->
    <section id="tab-home" class="tab-content active">
      <div class="bg-gray-800 rounded-2xl p-6 mb-6 shadow-lg shadow-black/50 relative overflow-hidden">
        <div class="absolute -right-10 -top-10 opacity-20"><i class="fas fa-tint text-9xl text-wassersGold"></i></div>
        <h2 class="text-2xl font-semibold mb-2">Welcome Back</h2>
        <p class="text-gray-300 text-sm mb-4">Tap below to place your next order.</p>
        <button onclick="window.switchTab('tab-shop')" class="bg-wassersGold text-black font-bold py-2 px-6 rounded-full shadow-lg">Order Now</button>
      </div>
      <h3 class="text-lg font-semibold text-wassersGold mb-3 border-b border-gray-800 pb-2">Quick Actions</h3>
      <div class="grid grid-cols-2 gap-4">
        <button class="bg-gray-800 p-4 rounded-xl flex flex-col items-center justify-center border border-gray-700">
          <i class="fas fa-redo-alt text-2xl text-wassersGold mb-2"></i>
          <span class="text-sm">Repeat Last Order</span>
        </button>
        <button class="bg-gray-800 p-4 rounded-xl flex flex-col items-center justify-center border border-gray-700">
          <i class="fas fa-file-invoice text-2xl text-wassersGold mb-2"></i>
          <span class="text-sm">Download GST Bill</span>
        </button>
      </div>
    </section>

    <!-- 2. SHOP TAB -->
    <section id="tab-shop" class="tab-content">
      <h2 class="text-xl font-bold text-wassersGold mb-4">Premium Hydration</h2>
      <div class="grid grid-cols-1 gap-5">
        <div class="bg-gray-800 rounded-2xl p-4 flex items-center shadow-lg border border-gray-700">
          <div class="w-24 h-24 bg-gray-900 rounded-xl flex items-center justify-center border border-gray-700">
             <i class="fas fa-prescription-bottle text-4xl text-blue-400"></i>
          </div>
          <div class="ml-4 flex-1">
            <h3 class="font-bold text-lg">20L Water Capsule</h3>
            <p class="text-wassersGold font-semibold">₹80.00</p>
            <div class="flex items-center mt-2">
              <button class="bg-gray-700 w-8 h-8 rounded-full">-</button>
              <span class="mx-4 font-bold">1</span>
              <button class="bg-wassersGold text-black w-8 h-8 rounded-full font-bold">+</button>
            </div>
          </div>
        </div>
        <button onclick="startRazorpayPayment(80)" class="w-full bg-wassersGold text-black font-bold text-lg py-4 rounded-xl mt-4 shadow-[0_0_15px_rgba(212,175,55,0.4)]">Proceed to Checkout</button>
      </div>
    </section>

    <!-- 3. TRACK TAB (Live Streaming) -->
    <section id="tab-track" class="tab-content">
      <div class="bg-gray-800 rounded-t-3xl p-5 border-b border-gray-700">
        <h2 class="text-xl font-bold text-wassersGold">Live Delivery</h2>
        <p class="text-sm text-gray-400" id="vehicle-info">Locating your delivery...</p>
      </div>
      <!-- Google Map Container -->
      <div id="map" class="w-full h-[400px] bg-gray-900 flex items-center justify-center text-gray-500">
        Loading Secure Map...
      </div>
      <div class="bg-gray-800 rounded-b-3xl p-5 flex items-center justify-between">
        <div class="flex items-center">
          <div class="w-12 h-12 bg-gray-700 rounded-full flex items-center justify-center border-2 border-wassersGold"><i class="fas fa-user text-wassersGold"></i></div>
          <div class="ml-3">
            <p class="font-bold">Rahul (Rider)</p>
            <p class="text-xs text-green-400" id="live-status-text">🔴 Live</p>
          </div>
        </div>
        <a href="tel:+918469277377" class="bg-green-600 w-10 h-10 rounded-full flex items-center justify-center text-white shadow-lg"><i class="fas fa-phone"></i></a>
      </div>
    </section>

    <!-- 4. WALLET TAB -->
    <section id="tab-wallet" class="tab-content">
      <div class="bg-gradient-to-br from-gray-800 to-black rounded-3xl p-6 border border-gray-700 shadow-xl relative overflow-hidden mb-6">
        <div class="absolute top-0 right-0 w-32 h-32 bg-wassersGold/10 rounded-full blur-2xl"></div>
        <p class="text-gray-400 text-sm mb-1">Available Balance</p>
        <h2 class="text-4xl font-bold text-white mb-6">₹1,240.00</h2>
      </div>
    </section>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 w-full bg-black/95 backdrop-blur-lg border-t border-gray-800 flex justify-around py-2 pb-safe z-50">
    <button onclick="window.switchTab('tab-home')" class="nav-btn w-16 h-12 flex flex-col items-center justify-center text-wassersGold">
      <i class="fas fa-compass text-xl mb-1"></i><span class="text-[10px] font-semibold">Explore</span>
    </button>
    <button onclick="window.switchTab('tab-shop')" class="nav-btn w-16 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-wassersGold transition">
      <i class="fas fa-shopping-bag text-xl mb-1"></i><span class="text-[10px] font-semibold">Shop</span>
    </button>
    <button onclick="window.switchTab('tab-track')" class="nav-btn w-16 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-wassersGold transition">
      <i class="fas fa-route text-xl mb-1"></i><span class="text-[10px] font-semibold">Track</span>
    </button>
    <button onclick="window.switchTab('tab-wallet')" class="nav-btn w-16 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-wassersGold transition">
      <i class="fas fa-wallet text-xl mb-1"></i><span class="text-[10px] font-semibold">Wallet</span>
    </button>
  </nav>

  <!-- UI & FIREBASE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./config.js"; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Tab Switching Logic
    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-wassersGold');
        btn.classList.add('text-gray-500');
      });
      
      const activeBtn = document.querySelector(`button[onclick="window.switchTab('${tabId}')"]`);
      if (activeBtn) {
        activeBtn.classList.remove('text-gray-500');
        activeBtn.classList.add('text-wassersGold');
      }

      if (tabId === 'tab-track' && !mapInitialized) {
        initLiveMap();
      }
    };

    // Google Maps & Live Tracking Logic
    let map;
    let riderMarker;
    let mapInitialized = false;

    function initLiveMap() {
      if (typeof google === 'undefined') {
        document.getElementById('map').innerHTML = "Google Maps failed to load. Check API Key.";
        return;
      }

      const mapElement = document.getElementById('map');
      const darkMapStyle = [
        { elementType: "geometry", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#242f3e" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#746855" }] },
        { featureType: "road", elementType: "geometry", stylers: [{ color: "#38414e" }] },
        { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#212a37" }] },
        { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#9ca5b3" }] },
        { featureType: "water", elementType: "geometry", stylers: [{ color: "#17263c" }] }
      ];

      map = new google.maps.Map(mapElement, {
        center: { lat: 21.1702, lng: 72.8311 }, // Surat default
        zoom: 15,
        disableDefaultUI: true,
        styles: darkMapStyle
      });
      
      mapInitialized = true;

      const riderDocRef = doc(db, "active_deliveries", "maruti_eeco_01");
      
      onSnapshot(riderDocRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          if (data.riderLocation) {
            const currentPos = { lat: data.riderLocation.latitude, lng: data.riderLocation.longitude };
            
            map.panTo(currentPos);

            if (data.vehicle) {
              document.getElementById('vehicle-info').innerText = `Arriving in: ${data.vehicle}`;
            }

            if (!riderMarker) {
              riderMarker = new google.maps.Marker({
                position: currentPos,
                map: map,
                icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  scale: 10,
                  fillColor: "#D4AF37",
                  fillOpacity: 1,
                  strokeWeight: 3,
                  strokeColor: "#ffffff"
                }
              });
            } else {
              riderMarker.setPosition(currentPos);
            }
          }
        }
      });
    }

    // Razorpay Stub
    window.startRazorpayPayment = function(amount) {
      alert("Payment gateway will launch for ₹" + amount);
    };
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker Registered Successfully"));
    }
  </script>
</body>
</html>
