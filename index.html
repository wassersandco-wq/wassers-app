<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wassers & Co. | Premium Hydration</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- WhatsApp & Social Media Preview Tags (Open Graph) -->
  <meta property="og:title" content="Wassers & Co. | Premium Hydration">
  <meta property="og:description" content="Order 20L water capsules and PET bottles. Live tracking and free delivery across Surat.">
  <meta property="og:image" content="https://app.wassersand.co/icons/icon-512.png">
  <meta property="og:url" content="https://app.wassersand.co/">
  <meta property="og:type" content="website">

  <!-- Apple iOS Native App Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wassers & Co.">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: { 
          colors: { 
            wassersNavy: '#0A192F', 
            wassersGold: '#C5A059',
            lightGray: '#F9FAFB',
            borderGray: '#E5E7EB',
            bgGray: '#F8F9FA'
          },
          fontFamily: { sans: ['Inter', 'Segoe UI', 'Roboto', 'sans-serif'] }
        }
      }
    }
  </script>  
  <style>
    :root {
      --navy: #0A192F;
      --cyan: #00B4D8;
      --gold: #C5A059;
      --white: #ffffff;
      --light-bg: #f0f8ff; /* Light bubble-water feel */
    }
    
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--light-bg);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--navy);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--white);
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .hero {
      background: linear-gradient(135deg, var(--white) 0%, #e0f7fa 100%);
      text-align: center;
      padding: 40px 20px;
      border-bottom: 3px solid var(--cyan);
    }

    .hero h2 {
      color: var(--navy);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    /* Product Grid - Storefront Showcase */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto;
      flex-grow: 1;
    }

    .product-card {
      background: var(--white);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 15px rgba(0,180,216,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 1px solid #e0f2f1;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0,180,216,0.2);
      border-color: var(--cyan);
    }

    .product-card img {
      max-width: 100px;
      height: auto;
      margin-bottom: 15px;
    }

    .btn-order {
      background-color: var(--navy);
      color: var(--white);
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    .btn-order:hover {
      background-color: var(--cyan);
    }

    /* Updated Footer */
    footer {
      text-align: center;
      padding: 25px 20px;
      background-color: var(--navy);
      color: var(--white);
      margin-top: auto;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .social-links a {
      color: var(--cyan);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .social-links a:hover {
      color: var(--gold);
    }
  </style>
</head>
<body>

  <header>
    <h1>WASSERS & CO.</h1>
    <!-- Navigation / Login Link -->
    <div style="cursor: pointer; font-weight: bold; color: var(--cyan);" onclick="window.location.href='customer.html'">Sign In</div>
  </header>

  <div class="hero">
    <h2>Refresh Your Day</h2>
    <p style="color: #555; font-size: 1.1rem; margin-top: 5px;">Pure drinking water delivered 24/7 in Surat.</p>
  </div>

  <div class="product-grid">
    <!-- 20L Capsule (Shows new ₹80 pricing for Jan 2027) -->
    <div class="product-card">
      <img src="icons/wassers-20L.png" alt="20L Water Capsule">
      <h3 style="margin: 10px 0; color: var(--navy);">20L Capsule</h3>
      <p style="color: var(--gold); font-weight: bold; font-size: 1.2rem;">₹80</p>
      <button class="btn-order">Order Now</button>
    </div>
    <!-- 1L Bottle -->
    <div class="product-card">
      <img src="icons/wassers-1L.png" alt="1L Water Bottle">
      <h3 style="margin: 10px 0; color: var(--navy);">1L Bottle</h3>
      <p style="color: var(--gold); font-weight: bold; font-size: 1.2rem;">Standard</p>
      <button class="btn-order">Order Now</button>
    </div>
    <!-- 500ml Bottle -->
    <div class="product-card">
      <img src="icons/wassers-500ml.png" alt="500ml Water Bottle">
      <h3 style="margin: 10px 0; color: var(--navy);">500ml Bottle</h3>
      <p style="color: var(--gold); font-weight: bold; font-size: 1.2rem;">Standard</p>
      <button class="btn-order">Order Now</button>
    </div>
    <!-- 200ml Bottle -->
    <div class="product-card">
      <img src="icons/wassers-200ml.png" alt="200ml Water Bottle">
      <h3 style="margin: 10px 0; color: var(--navy);">200ml Bottle</h3>
      <p style="color: var(--gold); font-weight: bold; font-size: 1.2rem;">Standard</p>
      <button class="btn-order">Order Now</button>
    </div>
  </div>

  <footer>
    <!-- Tagline kept non-italic and gold -->
    <p style="margin-bottom: 10px; color: var(--gold); font-style: normal; font-weight: 500;">Clean Water, Clear Promise</p>
    
    <div class="social-links">
      <!-- Your New X Profile Link -->
      <a href="https://x.com/wasserandco" target="_blank" aria-label="Follow Wassers & Co. on X">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 22.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </div>
    
    <p style="margin-top: 15px; font-size: 0.8rem; color: #ccc;">&copy; 2026 Wassers & Co. All rights reserved.</p>
  </footer>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }, err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
<!-- Firebase SDK Setup (Modular Version) -->
  <script type="module">
    // Import standard Firebase libraries
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    // Your Wassers & Co. Firebase configuration
    // (Copy these values from your Firebase Project Settings > General > Your apps)
    const firebaseConfig = {
      apiKey: "AIzaSyBDfqeVALHqS7HgkyQLHfOOrmgEEuQXttE",
      authDomain: "wassers-app.firebaseapp.com",
      projectId: "wassers-app",
      storageBucket: "wassers-app.firebasestorage.app",
      messagingSenderId: "75361094126",
      appId: "1:75361094126:web:f151de8abb748e07aba6ff",
      measurementId: "G-2TV4EGYW19"
    };

    // Initialize Firebase Services
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Listen for authentication state to update the UI dynamically
    onAuthStateChanged(auth, (user) => {
      const authLink = document.querySelector('header div');
      if (user) {
        // If a user is already logged in, update the header text
        console.log("Active session for:", user.email);
        authLink.innerText = "My Dashboard";
        
        // Redirect them to their proper portal if they click it
        authLink.onclick = () => {
          if (user.email === 'admin@wassersand.co') {
            window.location.href = 'admin.html';
          } else if (user.email === 'rider1@wassersand.co') {
            window.location.href = 'rider.html';
          } else {
            window.location.href = 'customer.html';
          }
        };
      }
    });
  </script>
  
</body>
</html>
