<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wassers & Co. | Owner Command Center</title>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root { --navy: #0A192F; --card: #112240; --cyan: #00B4D8; --text: #E6F1FF; --muted: #8892B0; }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { margin: 0; background: var(--navy); color: var(--text); padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #233554; }
    h1 { font-size: 1.3rem; margin: 0; color: var(--cyan); }
    .btn { background: var(--cyan); color: #0A192F; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-danger { background: #ef4444; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 14px; border: 1px solid #233554; }
    h2 { margin-top: 0; font-size: 1.1rem; color: var(--cyan); }
    input { width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 8px; border: 1px solid #233554; background: #0A192F; color: white; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #233554; }
    .badge { background: rgba(0,180,216,0.15); color: var(--cyan); padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; }
    
    /* Dark Mode Map Filters */
    .leaflet-layer,
    .leaflet-control-zoom-in,
    .leaflet-control-zoom-out,
    .leaflet-control-attribution {
      filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
    }
    .custom-eeco-icon { font-size: 28px; text-align: center; line-height: 1; filter: none; }
  </style>
</head>
<body>
  <header>
    <h1>WASSERS & CO. — Owner Control</h1>
    <button class="btn-danger" id="logoutBtn">Logout</button>
  </header>

  <div class="grid">
    <!-- LIVE MAP CARD (Full Width) -->
    <div class="card" style="grid-column: 1 / -1;">
      <h2>Live Rider Tracking (Eeco Fleet)</h2>
      <!-- Map Container -->
      <div id="map" style="height: 400px; width: 100%; border-radius: 8px; border: 1px solid #233554; z-index: 1;"></div>
      <p id="mapStatus" style="color: var(--muted); font-size: 0.85rem; margin-top: 10px;">Initializing Surat City Map...</p>
    </div>

    <div class="card">
      <h2>Add / Update Water SKU</h2>
      <input type="text" id="pName" placeholder="Product Name (e.g., Wassers 20L Capsule)" />
      <input type="number" id="pPrice" placeholder="Price in ₹ (e.g., 80)" />
      <input type="text" id="pVolume" placeholder="Volume (e.g., 20L / 1L / 500ml / 200ml)" />
      <input type="text" id="pTds" placeholder="TDS Level (e.g., 65 PPM Balanced)" />
      <input type="text" id="pPh" placeholder="pH Level (e.g., 7.4 Alkaline)" />
      <input type="text" id="pMediaUrl" placeholder="Image/GIF Path (e.g., ./20l-capsule.png)" />
      <button class="btn" id="saveProductBtn" style="width:100%;">Publish to Live App</button>
      <p id="uploadStatus" style="color:var(--cyan); font-size:0.85rem;"></p>
    </div>

    <div class="card">
      <h2>Active Catalog & Stock</h2>
      <div id="productList">Loading catalog...</div>
    </div>

    <div class="card">
      <h2>Rider Permissions Control</h2>
      <div id="riderList">Loading riders...</div>
    </div>

    <div class="card">
      <h2>Google Reviews & Website Links</h2>
      <input type="url" id="reviewUrl" placeholder="Google Review Link (https://g.page/r/...)" />
      <input type="url" id="webUrl" value="https://wassersand.co" />
      <button class="btn" id="saveSettingsBtn" style="width:100%;">Update App Links</button>
    </div>
  </div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { doc, getDoc, setDoc, collection, addDoc, onSnapshot, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // --- MAP INITIALIZATION ---
    // Centered on Surat, Gujarat
    const map = L.map('map').setView([21.1702, 72.8311], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
    }).addTo(map);

    // Custom Van Emoji Marker
    const eecoIcon = L.divIcon({
      html: '<div class="custom-eeco-icon">🚐</div>',
      className: '',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const riderMarkers = {};
    const mapStatus = document.getElementById("mapStatus");

    // --- FIREBASE LIVE RADAR ---
    onSnapshot(collection(db, "active_deliveries"), (snap) => {
      if (snap.empty) {
        mapStatus.innerText = "No active riders currently broadcasting.";
        return;
      }
      
      snap.forEach((d) => {
        const data = d.data();
        if (data.location) {
          const lat = data.location.latitude;
          const lng = data.location.longitude;
          
          if (riderMarkers[d.id]) {
            // Move existing marker smoothly
            riderMarkers[d.id].setLatLng([lat, lng]);
          } else {
            // Add new Eeco to the map
            riderMarkers[d.id] = L.marker([lat, lng], {icon: eecoIcon})
              .addTo(map)
              .bindPopup(`<b>${data.vehicle || "Delivery Eeco"}</b><br>ID: ${d.id}`);
          }
          // Center map on the rider's latest location
          map.flyTo([lat, lng], 14);
          mapStatus.innerText = `🟢 Live signal received at ${new Date().toLocaleTimeString()}`;
        }
      });
    });
    // ---------------------------

    onAuthStateChanged(auth, async (user) => {
      if (!user) return (window.location.href = "/index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const role = snap.exists() ? snap.data().role : "customer";
      if (role !== "owner" && role !== "admin") window.location.href = "/index.html";
    });

    document.getElementById("logoutBtn").onclick = () => signOut(auth);

    document.getElementById("saveProductBtn").onclick = async () => {
      const status = document.getElementById("uploadStatus");
      status.innerText = "Publishing SKU...";
      await addDoc(collection(db, "products"), {
        name: document.getElementById("pName").value,
        price: Number(document.getElementById("pPrice").value),
        volume: document.getElementById("pVolume").value,
        tds: document.getElementById("pTds").value,
        ph: document.getElementById("pPh").value,
        mediaUrl: document.getElementById("pMediaUrl").value || "./logo.png",
        inStock: true,
        updatedAt: serverTimestamp()
      });
      status.innerText = "Published to live store!";
    };

    onSnapshot(collection(db, "products"), (snap) => {
      const list = document.getElementById("productList");
      list.innerHTML = "";
      snap.forEach((d) => {
        const p = d.data();
        list.innerHTML += `
          <div class="item-row">
            <div><strong>${p.name}</strong><br><span class="badge">₹${p.price} • TDS: ${p.tds}</span></div>
            <button class="btn-danger" onclick="window.deleteProd('${d.id}')">Delete</button>
          </div>`;
      });
    });
    window.deleteProd = (id) => deleteDoc(doc(db, "products", id));

    onSnapshot(collection(db, "users"), (snap) => {
      const list = document.getElementById("riderList");
      list.innerHTML = "";
      snap.forEach((d) => {
        const u = d.data();
        if (u.role === "rider") {
          list.innerHTML += `
            <div class="item-row">
              <div><strong>${u.name || "Rider"}</strong><br><small>Cash Collection: ${u.canCollectCash ? "Allowed" : "Blocked"}</small></div>
              <button class="btn" onclick="window.toggleCash('${d.id}', ${!u.canCollectCash})">Toggle Cash</button>
            </div>`;
        }
      });
    });
    window.toggleCash = (uid, val) => updateDoc(doc(db, "users", uid), { canCollectCash: val });

    document.getElementById("saveSettingsBtn").onclick = async () => {
      await setDoc(doc(db, "settings", "company_info"), {
        googleReviewUrl: document.getElementById("reviewUrl").value,
        websiteUrl: document.getElementById("webUrl").value,
        whatsappNumber: "918469277377"
      }, { merge: true });
      alert("Company links updated!");
    };
  </script>
</body>
</html>
